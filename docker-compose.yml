services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: teamup_db
      POSTGRES_USER: teamup
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - db
    environment:
      REDIS_URL: redis://redis:6379/0

  worker:
    build: .
    command: celery -A teamup_backend_mvp worker --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - redis
      - db
    environment:
      REDIS_URL: redis://redis:6379/0

  beat:
    build: .
    command: celery -A teamup_backend_mvp beat --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - redis
      - db
    environment:
      REDIS_URL: redis://redis:6379/0

volumes:
  redis_data: